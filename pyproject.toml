[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydvb"
version = "0.1.0"
description = "Python AF9015 DVB-T USB bridge framework"
requires-python = ">=3.10"
dependencies = [
	"libusb1>=3.4.0",
	"libusb-package>=1.0.30.0",
	"construct>=2.10.70",
	"requests>=2.34.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
gui = ["PySide6-Essentials>=6.12.0"]
player = ["PySide6-Essentials>=6.12.0", "PySide6-Addons>=6.12.0"]

[project.scripts]
pydvb-gui = "pydvb.gui.__main__:main"

[tool.setuptools.packages.find]
include = ["pydvb*"]

[tool.setuptools.package-data]
"pydvb.gui" = ["*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
